; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_src_filter = +<*> -<xiao_esp32c3/>
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.10.1
	lennarthennigs/Button2@^1.6.5

; Seeed XIAO ESP32-C3 port: menu with tetris, snake, dodge, bricks and memory, wifi setup portal, OTA updates.
; See src/xiao_esp32c3/main.cpp for the wiring and test/host_esp32c3/run.sh for the tests.
[env:seeed_xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
build_src_filter = -<*> +<xiao_esp32c3/>
lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.3
	tzapu/WiFiManager@^2.0.17
